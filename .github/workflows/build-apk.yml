name: Build APK from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unzip project
        run: |
          set -e
          ZIP=""; BEST=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$BEST" ]; then BEST=$t; ZIP="$f"; fi
          done
          test -n "$ZIP"
          echo "Using zip: $ZIP"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          mkdir project_tmp
          unzip -q "$ZIP" -d project_tmp
          P=$(find project_tmp -maxdepth 2 -name package.json | head -n1)
          test -n "$P"
          mv "$(dirname "$P")" project
          grep -q html2canvas project/package.json || { echo "::error::'$ZIP' পুরোনো zip। repo থেকে পুরোনো zip মুছে শুধু সর্বশেষ zip রাখুন।"; exit 1; }
      - name: Set build number and repo
        run: sed -i "s/__BUILD__/${{ github.run_number }}/; s#__REPO__#${{ github.repository }}#" project/www/index.html
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        working-directory: project
        run: npm install
      - name: Copy libraries for offline use
        working-directory: project
        run: |
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-firestore-compat.js node_modules/firebase/firebase-auth-compat.js www/
          cp node_modules/html2canvas/dist/html2canvas.min.js www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
      - name: Add Android platform
        working-directory: project
        run: |
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: App icon and splash from logo
        working-directory: project
        run: |
          set -e
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d s f <<< "$spec"
            mkdir -p "$RES/mipmap-$d"
            convert resources/icon.png -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            I=$((f*62/100))
            convert resources/icon.png -resize ${I}x${I} -background white -gravity center -extent ${f}x${f} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/values"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"
          for f in $(find "$RES" -name splash.png); do
            W=$(identify -format %w "$f"); H=$(identify -format %h "$f"); M=$(( (W<H?W:H)*40/100 ))
            convert resources/icon.png -resize ${M}x${M} -background white -gravity center -extent ${W}x${H} "$f"
          done
      - name: Use fixed signing key (so updates install over old app)
        run: |
          mkdir -p ~/.android
          cp project/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: project/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk kajer-hisab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kajer-hisab-apk
          path: kajer-hisab.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: কাজের হিসাব build ${{ github.run_number }}
          make_latest: true
          files: kajer-hisab.apk
